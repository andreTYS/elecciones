# Copia de referencia del nginx del contenedor frontend
# (el archivo activo es frontend/nginx.conf, incluido en la imagen Docker)

server {
  listen 80;
  server_name votocontrol.moqueguasoft.com;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://votocontrol-backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 20m;
  }

  location /socket.io/ {
    proxy_pass http://votocontrol-backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
