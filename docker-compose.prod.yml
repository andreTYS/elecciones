# VotoControl Moquegua 2026 — Producción (VPS Hostinger + Traefik)
# Requiere .env junto a este archivo con: DATABASE_URL, REDIS_URL, JWT_SECRET,
# JWT_REFRESH_SECRET, GEMINI_ENCRYPT_KEY, DB_USER, DB_PASS

services:
  votocontrol-backend:
    build: ./backend
    container_name: votocontrol-backend
    restart: always
    depends_on:
      - votocontrol-db
      - votocontrol-redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_ENCRYPT_KEY=${GEMINI_ENCRYPT_KEY}
      - NODE_ENV=production
      - CORS_ORIGIN=https://votos.masredespro.com
      - UPLOAD_DIR=/app/uploads
    volumes:
      - votocontrol-uploads:/app/uploads
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.votocontrol-api.rule=Host(`votos.masredespro.com`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))"
      - "traefik.http.routers.votocontrol-api.entrypoints=websecure"
      - "traefik.http.routers.votocontrol-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.votocontrol-api.loadbalancer.server.port=4000"

  votocontrol-frontend:
    build: ./frontend
    container_name: votocontrol-frontend
    restart: always
    depends_on:
      - votocontrol-backend
    # Puerto publicado en el host para servidores frontales que no son Traefik
    # (Apache/Nginx del host hacen proxy a este puerto). El nginx interno del
    # frontend ya enruta /api y /socket.io al backend, asi que basta un puerto.
    ports:
      - "${FRONT_PORT:-8085}:80"
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.votocontrol.rule=Host(`votos.masredespro.com`)"
      - "traefik.http.routers.votocontrol.entrypoints=websecure"
      - "traefik.http.routers.votocontrol.tls.certresolver=letsencrypt"
      - "traefik.http.routers.votocontrol.priority=1"
      - "traefik.http.services.votocontrol.loadbalancer.server.port=80"

  votocontrol-db:
    image: postgres:16-alpine
    container_name: votocontrol-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=votocontrol
    volumes:
      - votocontrol-postgres:/var/lib/postgresql/data
    networks:
      - traefik-network

  votocontrol-redis:
    image: redis:7-alpine
    container_name: votocontrol-redis
    restart: always
    networks:
      - traefik-network

volumes:
  votocontrol-postgres:
  votocontrol-uploads:

networks:
  traefik-network:
    external: true
